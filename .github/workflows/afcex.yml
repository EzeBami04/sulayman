name: Ncx price update

on:
  workflow_dispatch:
jobs:
  get_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: set up python
        uses: actions/setup-python@v5

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key files
        run: echo '${{ secrets.EOMO_JSON_KEY }}' > eomo_key.json

      - name: run scraper
        env:
          afri_ex: '{{ $secrets.AFRI_ID}}'
          eomo_key.json: eomo_key.json
          PYTHONPATH: ${{ github.workspace }}
        
        run: python src/afcex.py

      
